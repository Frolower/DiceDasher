server {
    listen 80;
    listen [::]:80;
    server_name dicedasher.dmitriy.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dicedasher-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dicedasher.dmitriy.space;
    ssl_certificate /etc/letsencrypt/live/dicedasher.dmitriy.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicedasher.dmitriy.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
