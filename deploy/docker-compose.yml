services:
  postgres:
    image: ${IMAGE_ROOT}-postgres:${IMAGE_TAG}
    command: [postgres, -c, shared_preload_libraries=pg_cron, -c, cron.database_name=user_db, -c, cron.timezone=UTC, -c, cron.use_background_workers=on]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      USER_PASSWORD: ${USER_PASSWORD:?}
      CHARACTER_PASSWORD: ${CHARACTER_PASSWORD:?}
      RESOLVE_PASSWORD: ${RESOLVE_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    image: ${IMAGE_ROOT}-backend:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://user_service:${USER_PASSWORD}@postgres:5432/user_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?}
      ALLOWED_ORIGINS: https://dicedasher.dmitriy.space
      COOKIE_SECURE: 'true'
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  character:
    image: ${IMAGE_ROOT}-character:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://character_service:${CHARACTER_PASSWORD}@postgres:5432/character_db?sslmode=disable
      ALLOWED_ORIGINS: https://dicedasher.dmitriy.space
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  resolve:
    image: ${IMAGE_ROOT}-resolve:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://resolve_service:${RESOLVE_PASSWORD}@postgres:5432/resolve_db?sslmode=disable
      ALLOWED_ORIGINS: https://dicedasher.dmitriy.space
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    image: ${IMAGE_ROOT}-frontend:${IMAGE_TAG}
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
