    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker's DNS resolves the backend again if its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_req zone=login_per_ip burst=4 nodelay;
        limit_req zone=register_per_ip burst=2 nodelay;

        limit_req_status 429;
        limit_req_log_level warn;

        set $backend http://backend:8000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes must also work when opened directly or refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
