map "$request_method:$uri" $api_limit_key {
    default $binary_remote_addr;

    ~^OPTIONS: "";
    ~^[^:]+:/api/health$ "";
}

map "$request_method:$uri" $login_limit_key {
    default "";
    "POST:/api/login" $binary_remote_addr;
}

map "$request_method:$uri" $register_limit_key {
    default "";
    "POST:/api/register" $binary_remote_addr;
}

limit_req_zone $api_limit_key
    zone=api_per_ip:10m rate=20r/s;

limit_req_zone $login_limit_key
    zone=login_per_ip:10m rate=5r/s;

limit_req_zone $register_limit_key
    zone=register_per_ip:10m rate=5r/m;
