# A collection of workflows to verify codebase before it will be merged into the master branch

name: PR Checks
run-name: ${{ github.actor }} is building and testing DiceDasher

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint
        working-directory: frontend
        run: npm run lint

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Tests
        working-directory: frontend
        run: npm test

  docker-build-frontend:
    name: Docker builds frontend
    runs-on: ubuntu-latest
    needs: frontend-tests
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: dicedasher-frontend:ci
          cache-from: type=gha,scope=frontend

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      POSTGRES_CONTAINER: dicedasher-postgres-ci

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL with pg_cron
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          tags: dicedasher-postgres:ci
          load: true
          cache-from: type=gha,scope=postgres

      - name: Start PostgreSQL with pg_cron
        run: bash database/tests/start-postgres.sh
        env:
          POSTGRES_IMAGE_PREBUILT: "1"

      - name: Initialize database
        run: |
          docker cp database/init "$POSTGRES_CONTAINER:/ci-init"
          docker exec "$POSTGRES_CONTAINER" sh -ec '
            for file in /ci-init/*.sql; do
              psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f "$file"
            done
          '

      - name: Test database triggers and permissions
        run: |
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < database/tests/updated_at.sql

      - name: Test session retention
        run: |
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < database/tests/session_cleanup.sql

      - name: Remove test database
        if: always()
        run: docker rm -f -v "$POSTGRES_CONTAINER"

  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg
          - services/backend
          - services/character
          - services/resolve

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            pkg/go.sum
            services/*/go.sum

      - name: Vet
        run: go vet ./${{ matrix.module }}/...

      - name: Test
        run: go test -race ./${{ matrix.module }}/...

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: database-tests
    timeout-minutes: 10

    env:
      POSTGRES_CONTAINER: dicedasher-postgres-ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            pkg/go.sum
            services/*/go.sum

      - uses: docker/setup-buildx-action@v3

      - name: Build PostgreSQL with pg_cron
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          tags: dicedasher-postgres:ci
          load: true
          cache-from: type=gha,scope=postgres

      - name: Start PostgreSQL with pg_cron
        run: bash database/tests/start-postgres.sh
        env:
          POSTGRES_IMAGE_PREBUILT: "1"

      - name: Initialize database
        run: |
          docker cp database/init "$POSTGRES_CONTAINER:/ci-init"
          docker exec "$POSTGRES_CONTAINER" sh -ec '
            for file in /ci-init/*.sql; do
              psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f "$file"
            done
          '

      - name: Run backend integration tests
        env:
          BACKEND_TEST_DATABASE_URL: postgres://user_service:user_password@localhost:5432/user_db?sslmode=disable
          BACKEND_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/user_db?sslmode=disable
        run: >-
          go test -race -count=1 -v
          ./services/backend/internal/handler
          -run 'Postgres$'

      - name: Remove test database
        if: always()
        run: docker rm -f -v "$POSTGRES_CONTAINER"

  docker-build:
    name: Docker builds (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-tests, integration-tests]
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - character
          - resolve

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: dicedasher-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}

  publish-images:
    name: Publish image (${{ matrix.service }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker-build-frontend, docker-build, database-tests]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: .
            dockerfile: ./services/backend/Dockerfile
          - service: character
            context: .
            dockerfile: ./services/character/Dockerfile
          - service: resolve
            context: .
            dockerfile: ./services/resolve/Dockerfile
          - service: postgres
            context: ./database
            dockerfile: ./database/Dockerfile.deploy
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max,ignore-error=true

  deploy:
    name: Deploy Frankfurt
    if: github.event_name == 'push'
    needs: [publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy verified commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$ACTOR" "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 37018 dmitriy@5.252.26.112 "$COMMIT"
