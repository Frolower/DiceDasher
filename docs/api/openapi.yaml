openapi: 3.1.0
info:
  title: DiceDasher API
  version: 0.1.0
  description: |
    API for DiceDasher's dice resolution, character, authentication, and profile services.
    Use the schema selector in Swagger UI to choose the request body that matches
    the `system` and `action` query parameters.
  license:
    name: MIT
    identifier: MIT
tags:
  - name: Health
    description: Service health checks
  - name: Resolve
    description: System-specific dice resolution
  - name: Backend
    description: Registration, authentication, sessions, and user profiles
  - name: Character
    description: Character creation and storage
paths:
  /login:
    post:
      tags: [Backend]
      summary: Sign in with username and password
      description: |
        Creates a 30-day session and issues a 10-minute access JWT.
        Refresh token is sent only in an HttpOnly SameSite=Strict cookie.
        Browser requests must include credentials to save the cookie. Use /refresh to rotate it and obtain a new access JWT.
      operationId: loginUser
      servers:
        - url: http://localhost:8083
          description: Backend Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 72
                  description: 1–72 printable ASCII characters, without spaces or control characters; passed unchanged to bcrypt. Registration complexity is not enforced at login.
            example:
              username: Alice
              password: StrongPass1!
      responses:
        "200":
          description: Session saved. Refresh token is in Set-Cookie, not the response body.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly refresh cookie; Secure in HTTPS mode.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid JSON or missing/oversized fields.
        "401":
          description: Invalid username or password.
        "403":
          description: Origin is not allowed.
        "413":
          description: Request body exceeds 16 KiB.
        "415":
          description: Content-Type must be application/json.
        "500":
          description: Login failed internally; no tokens returned.
  /logout:
    post:
      tags: [Backend]
      summary: Sign out and revoke the current session
      description: |
        No request body or Content-Type is required. Reads the refresh token from
        __Host-refresh_token when COOKIE_SECURE=true, otherwise refresh_token.
        Browser requests must include credentials. Rejects disallowed Origin and
        Sec-Fetch-Site cross-site when Origin is absent.
        Revokes the matching session and deletes its refresh cookie. Repeated logout
        or an unknown token also succeeds. An absent cookie succeeds without Set-Cookie.
        Clients must discard their access JWT; signature verification alone does not
        check session revocation in the database.
      operationId: logoutUser
      servers:
        - url: http://localhost:8083
          description: Backend Service
      responses:
        "204":
          description: Session revoked or already absent. No response body.
          headers:
            Set-Cookie:
              description: When a refresh cookie was supplied, deletes it with Max-Age=0 and a past Expires; preserves its name, Path=/, HttpOnly, Secure setting and SameSite=Strict, without Domain.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        "400":
          description: Invalid cookie (text/plain).
        "403":
          description: Origin is not allowed or cross-site request has no Origin (text/plain).
        "500":
          description: Logout failed internally (text/plain); refresh cookie is retained for retry.
  /register:
    post:
      tags: [Backend]
      summary: Register a user without creating a session
      operationId: registerUser
      servers:
        - url: http://localhost:8083
          description: Backend Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 5
                  maxLength: 64
                  description: 5–64 printable ASCII characters, without spaces or control characters; not trimmed; unique ignoring case.
                email:
                  type: string
                  format: email
                  maxLength: 254
                  minLength: 5
                  description: Lowercased without trimming; 5–254 UTF-8 bytes; surrounding whitespace is rejected; unique ignoring case.
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  description: 8–72 printable ASCII characters; requires an English lowercase letter, uppercase letter, digit, and special character (including $, ^, or ~). No spaces or control characters. Not trimmed.
            example:
              username: Alice
              email: alice@example.com
              password: StrongPass1!
      responses:
        "201":
          description: User persisted; no session or cookie created.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: created
        "400":
          description: Invalid JSON or registration fields (text/plain).
        "409":
          description: Username or email already exists (text/plain).
        "413":
          description: Request body exceeds 16 KiB (text/plain).
        "500":
          description: Registration failed (text/plain); internal details are hidden.
  /me:
    get:
      tags: [Backend]
      summary: Read the authenticated user's profile
      description: |
        Auth middleware verifies the Bearer JWT and its active database session.
        user.Service loads the profile using only the authenticated ID.
        Query parameters cannot override the target user. Does not change cookies.
      operationId: getMyProfile
      servers:
        - url: http://localhost:8083
          description: Backend Service
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user's profile.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Missing/invalid token, inactive session, or missing user (text/plain).
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer authentication challenge.
        "500":
          description: Profile lookup failed internally (text/plain).
  /user:
    patch:
      tags: [Backend]
      summary: Update the authenticated user's profile
      description: |
        Send username, email, or both. Fields are trimmed; email is lowercased.
        Missing fields, empty strings, and null leave that field unchanged.
        At least one field must be nonempty after normalization.
        The target ID is taken from verified Bearer claims; an id field in JSON is rejected.
        Username and email are unique ignoring case. Both changes are atomic:
        a conflict rejects the entire update. A database trigger sets updated_at on every successful update, including unchanged values.
        Responses use Cache-Control no-store and Pragma no-cache; cookies are unchanged.
      operationId: updateMyProfile
      servers:
        - url: http://localhost:8083
          description: Backend Service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: [string, "null"]
                  description: After trimming, a nonempty username must be 5–64 printable ASCII characters with no whitespace or control characters.
                email:
                  type: [string, "null"]
                  description: After trimming and lowercasing, a nonempty email must pass format validation and be 5–254 UTF-8 bytes.
            examples:
              bothFields:
                value: {username: AliceNew, email: alice.new@example.com}
              usernameOnly:
                value: {username: AliceNew}
              emailOnly:
                value: {email: alice.new@example.com}
      responses:
        "200":
          description: Profile updated; the response is a JSON string.
          content:
            application/json:
              schema: {type: string, const: success}
              example: success
        "400":
          description: Invalid JSON/fields, unknown fields, or no nonempty values to update (text/plain).
        "401":
          description: Missing/invalid token or inactive session (text/plain).
        "404":
          description: Authenticated user no longer exists (text/plain).
        "409":
          description: Username or email is already in use (text/plain); no changes saved.
        "413":
          description: Request body exceeds 16 KiB (text/plain).
        "500":
          description: Update failed internally (text/plain); storage details are hidden.
    delete:
      tags: [Backend]
      summary: Delete the authenticated account
      description: |
        No request body is required. The user ID comes from verified Bearer claims.
        Deletes the user and all their sessions through ON DELETE CASCADE.
        Expires the configured refresh cookie; clients must clear the access JWT locally.
        Character data in the separate character database is retained.
        Reusing the token normally returns 401 after its session is deleted.
        Responses use Cache-Control no-store and Pragma no-cache.
      operationId: deleteMyAccount
      servers:
        - url: http://localhost:8083
          description: Backend Service
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account and sessions deleted; the response is a JSON string.
          headers:
            Set-Cookie:
              description: Expires the configured refresh cookie with Path=/ and matching security attributes.
              schema: {type: string}
          content:
            application/json:
              schema: {type: string, const: success}
        "401":
          description: Missing/invalid token or inactive session (text/plain).
        "404":
          description: User disappeared after authentication (text/plain).
        "500":
          description: Deletion failed internally (text/plain).
  /password:
    put:
      tags: [Backend]
      summary: Change the authenticated user's password
      description: |
        The user ID comes from verified Bearer claims. Both passwords must meet
        current registration complexity rules, including the old password.
        Verifies the old password with bcrypt and conditionally replaces its hash.
        A concurrent hash change returns 404. The database trigger sets updated_at.
        Existing sessions and tokens remain valid; cookies are unchanged.
        Responses use Cache-Control no-store and Pragma no-cache.
      operationId: updateMyPassword
      servers:
        - url: http://localhost:8083
          description: Backend Service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [old_password, new_password]
              properties:
                old_password:
                  $ref: "#/components/schemas/PasswordChangeValue"
                new_password:
                  $ref: "#/components/schemas/PasswordChangeValue"
            example:
              old_password: StrongPass1!
              new_password: NewStrongPass2!
      responses:
        "200":
          description: Password hash updated; the response is a JSON string.
          content:
            application/json:
              schema: {type: string, const: success}
        "400":
          description: Invalid JSON, unknown/missing fields, invalid password format, or incorrect old password (text/plain).
        "401":
          description: Missing/invalid token or inactive session (text/plain).
        "404":
          description: User not found or stored hash changed concurrently (text/plain).
        "413":
          description: Request body exceeds 16 KiB (text/plain).
        "500":
          description: Password change failed internally (text/plain); storage details are hidden.
  /refresh:
    post:
      tags: [Backend]
      summary: Rotate the refresh token and issue an access JWT
      description: |
        No body or Content-Type is required. Reads __Host-refresh_token when
        COOKIE_SECURE=true, otherwise refresh_token. Browsers must include credentials.
        Applies the same Origin and cross-site checks as login/logout.
        Rotates the stored token hash conditionally; the old token stops working.
        The session expiry is retained. Access expiry is at most 10 minutes,
        capped at the session expiry. Responses use Cache-Control no-store and Pragma no-cache.
      operationId: refreshSession
      servers:
        - url: http://localhost:8083
          description: Backend Service
      security:
        - SecureRefreshCookie: []
        - LocalRefreshCookie: []
      responses:
        "200":
          description: New access JWT and rotated refresh cookie.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: Rotated HttpOnly SameSite=Strict refresh cookie; Secure in HTTPS mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid cookie (text/plain).
        "401":
          description: Cookie absent, token unknown, or session expired/revoked/already rotated.
        "403":
          description: Origin is not allowed or cross-site request has no Origin (text/plain).
        "500":
          description: Refresh failed internally (text/plain).
  /health:
    get:
      tags: [Health]
      summary: Check service health
      operationId: health
      servers:
        - url: http://localhost:8080
          description: Resolve Service
        - url: http://localhost:8081
          description: Character Service
        - url: http://localhost:8083
          description: Backend Service
      responses:
        "200":
          description: The selected service is healthy.
          content:
            text/plain:
              schema:
                type: string
                const: OK
              example: OK
  /resolve:
    post:
      tags: [Resolve]
      summary: Resolve a dice action
      description: |
        Dispatches a request to the selected game system. If `action` is omitted,
        it defaults to `roll`. Choose the matching request schema in Swagger UI.
        Roll history is persisted when the database is available.
      operationId: resolveDice
      servers:
        - url: http://localhost:8080
          description: Resolve Service
      parameters:
        - name: system
          in: query
          required: true
          description: Game system identifier.
          schema:
            type: string
            enum: [generic, vtmv5, tes]
        - name: action
          in: query
          required: false
          description: System-specific action. Defaults to `roll`.
          schema:
            type: string
            default: roll
            enum: [roll, reroll, check, push]
      requestBody:
        required: false
        description: No body must be sent for `system=vtmv5&action=check`.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GenericRollRequest"
                - $ref: "#/components/schemas/VtmRollRequest"
                - $ref: "#/components/schemas/VtmRerollRequest"
                - $ref: "#/components/schemas/TesRollRequest"
                - $ref: "#/components/schemas/RecordRequest"
            examples:
              genericRoll:
                summary: Generic 3d6 roll
                value:
                  number: 3
                  size: 6
              vtmRoll:
                summary: VTM V5 roll
                value:
                  attribute: 3
                  skill: 2
                  hunger: 2
                  target: 3
              vtmReroll:
                summary: VTM V5 willpower reroll
                value:
                  record_id: 923a67f6-a421-41cf-b323-f71c0e7caffc
                  reroll_index: [0, 1]
              tesRoll:
                summary: The Electric State roll
                value:
                  attr: 4
                  assist: 1
                  gear: 2
                  modificator: 0
                  target: 2
              tesPush:
                summary: Push a previous TES roll
                value:
                  record_id: 90e8e1f0-c213-4fa3-9a64-7d7ce3115e04
      responses:
        "200":
          description: Action resolved and history saved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: History record cannot be continued by this action or lacks continuation state.
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /character:
    post:
      tags: [Character]
      summary: Create a character
      description: Validates a system-specific character, stores it in PostgreSQL, and returns its UUID.
      operationId: createCharacter
      servers:
        - url: http://localhost:8081
          description: Character Service
      parameters:
        - name: system
          in: query
          required: true
          description: Game system identifier.
          schema:
            type: string
            enum: [tes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TesCharacterCreateRequest"
            examples:
              relaxedValidation:
                summary: Minimal request with rule validation disabled
                value:
                  user_id: d7a92c4c-7c65-41d8-946a-4b94d3e721f9
                  type: pc
                  rules: false
                  character:
                    name: Mira
              completeCharacter:
                summary: Complete TES character sheet
                value:
                  user_id: d7a92c4c-7c65-41d8-946a-4b94d3e721f9
                  type: pc
                  rules: true
                  character:
                    name: Mira
                    archetype: investigator
                    favourite_song: Running Up That Hill
                    description: A traveller searching for the truth.
                    stats:
                      strength: 4
                      agility: 4
                      wits: 4
                      empathy: 4
                    derivatives:
                      health: 4
                      hope: 4
                    bliss:
                      bliss: 0
                      permanent: 0
                    talents: [sleuth]
                    dream: Find the missing children.
                    flaw: Never lets a mystery go.
                    gear:
                      - name: Flashlight
                        code: flashlight
                        type: gear
                        bonus: 1
                        price: 10
                        notes: Battery powered.
                    cash: 100
                    journey:
                      goal: Reach the exclusion zone.
                      threat: Government patrols.
                    tension:
                      - traveller_name: Alex
                        tension: 1
                    conditions:
                      injuries: []
                      traumas: []
                    vehicle:
                      vehicle_type: 4wdCar
                      model: Station wagon
                      passenger: 5
                      fuel: gasoline
                      description: The group's vehicle.
                      stats:
                        maneuverability: 1
                        speed: 2
                        hull: 3
                        armor: 1
                        traits:
                          - name: hull
                            stat: hull
                            bonus: 1
                        gear: []
                      SharedGear:
                        - {name: Toolbox, code: toolbox, type: gear, bonus: 1, price: 0, notes: ""}
                        - {name: Radio, code: radio, type: gear, bonus: 1, price: 0, notes: ""}
                        - {name: First aid kit, code: firstAid, type: gear, bonus: 1, price: 0, notes: ""}
      responses:
        "201":
          description: Character created and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCharacterResponse"
              example:
                id: 90e8e1f0-c213-4fa3-9a64-7d7ce3115e04
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    SecureRefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-refresh_token
      description: HttpOnly cookie used when COOKIE_SECURE=true; sent by the browser.
    LocalRefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly cookie used when COOKIE_SECURE=false; sent by the browser.
  responses:
    BadRequest:
      description: Missing parameter, malformed JSON, or invalid action.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown game system.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request fields violate system validation rules.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server or database error.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PasswordChangeValue:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      pattern: '^[!-~]+$'
      description: Requires an English lowercase letter, uppercase letter, digit, and printable ASCII special character. No whitespace or control characters; passed unchanged.
    UserProfile:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: string
          format: uuid
          description: User UUID; newly registered users receive UUID v7.
        username:
          type: string
        email:
          type: string
          format: email
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
    Error:
      type: string
      example: validation failed
    GenericRollRequest:
      type: object
      title: Generic roll
      required: [number, size]
      properties:
        number:
          type: integer
          minimum: 1
          description: Number of dice.
        size:
          type: integer
          minimum: 2
          description: Number of faces per die.
    VtmRollRequest:
      type: object
      title: VTM V5 roll
      required: [attribute, skill, hunger, target]
      properties:
        attribute: {type: integer, minimum: 1}
        skill: {type: integer, minimum: 0}
        hunger: {type: integer, minimum: 0}
        target: {type: integer, minimum: 1}
    VtmRerollRequest:
      type: object
      title: VTM V5 reroll
      required: [record_id, reroll_index]
      properties:
        record_id:
          type: string
          format: uuid
          description: Record ID returned by the original VTM roll.
        reroll_index:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0}
          description: Zero-based indices of regular dice to reroll.
    TesRollRequest:
      type: object
      title: The Electric State roll
      required: [attr, assist, gear, modificator, target]
      properties:
        attr: {type: integer, minimum: 1}
        assist: {type: integer, minimum: 0, maximum: 3}
        gear: {type: integer, minimum: 0}
        modificator:
          type: integer
          description: GM modifier; the resulting dice pool must remain positive.
        target:
          type: integer
          minimum: 0
          description: Required successes; cannot exceed attr + assist + gear.
    RecordRequest:
      type: object
      title: The Electric State push
      required: [record_id]
      properties:
        record_id:
          type: string
          format: uuid
          description: Record ID returned by the original TES roll.
    ResolveEnvelope:
      type: object
      required: [record_id, payload]
      properties:
        record_id:
          type: string
          format: uuid
          description: Persisted roll ID. History must be saved for the action to succeed.
        payload:
          oneOf:
            - $ref: "#/components/schemas/GenericRollResponse"
            - $ref: "#/components/schemas/VtmRollResponse"
            - $ref: "#/components/schemas/VtmRerollResponse"
            - $ref: "#/components/schemas/VtmCheckResponse"
            - $ref: "#/components/schemas/TesRollResponse"
            - $ref: "#/components/schemas/TesPushResponse"
    GenericRollResponse:
      type: object
      required: [expression, rolls, sum]
      properties:
        expression: {type: string, example: 3d6}
        rolls:
          type: array
          items: {type: integer}
          example: [3, 1, 2]
        sum: {type: integer, example: 6}
    VtmRollResponse:
      type: object
      required: [expression, main_roll, hunger_roll, successes, success, is_critical, crit_type]
      properties:
        expression: {type: string, example: 5d10}
        main_roll:
          type: array
          items: {type: integer, minimum: 1, maximum: 10}
        hunger_roll:
          type: array
          items: {type: integer, minimum: 1, maximum: 10}
        successes: {type: integer, minimum: 0}
        success: {type: boolean}
        is_critical: {type: boolean}
        crit_type:
          type: string
          enum: [none, critical, messy critical, bestial failure]
    VtmRerollResponse:
      allOf:
        - $ref: "#/components/schemas/VtmRollResponse"
        - type: object
          required: [reroll_expression]
          properties:
            reroll_expression: {type: string, example: 2d10}
    VtmCheckResponse:
      type: object
      required: [expression, result, success]
      properties:
        expression: {type: string, const: 1d10}
        result: {type: integer, minimum: 1, maximum: 10}
        success: {type: boolean}
    TesRollResponse:
      type: object
      required: [expression, attribute_rolls, gear_rolls, successes, success]
      properties:
        expression: {type: string, example: 7d6}
        attribute_rolls:
          type: array
          items: {type: integer, minimum: 1, maximum: 6}
        gear_rolls:
          type: array
          items: {type: integer, minimum: 1, maximum: 6}
        successes: {type: integer, minimum: 0}
        success: {type: boolean}
    TesPushResponse:
      allOf:
        - $ref: "#/components/schemas/TesRollResponse"
        - type: object
          required: [push_expression, hope_losses, gear_damage]
          properties:
            push_expression: {type: string, example: 3d6}
            hope_losses: {type: integer, minimum: 0}
            gear_damage: {type: integer, minimum: 0}
    CreateCharacterResponse:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    TesCharacterCreateRequest:
      type: object
      required: [user_id, type]
      properties:
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [pc, npc]
        rules:
          type: boolean
          default: false
          description: Validate the complete sheet against TES character creation rules.
        character:
          $ref: "#/components/schemas/TesCharacter"
    TesCharacter:
      type: object
      properties:
        name: {type: string}
        archetype:
          type: string
          enum: [artist, criminal, devotee, doctor, dronePilot, investigator, outsider, runawayKid, scientist, veteran]
        favourite_song: {type: string}
        description: {type: string}
        stats: {$ref: "#/components/schemas/TesStats"}
        derivatives: {$ref: "#/components/schemas/TesDerivatives"}
        bliss: {$ref: "#/components/schemas/TesBliss"}
        talents:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {$ref: "#/components/schemas/TesTalent"}
        dream: {type: string}
        flaw: {type: string}
        gear:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/TesGear"}
        cash: {type: integer, minimum: 0}
        journey: {$ref: "#/components/schemas/TesJourney"}
        tension:
          type: array
          items: {$ref: "#/components/schemas/TesTension"}
        conditions: {$ref: "#/components/schemas/TesConditions"}
        vehicle: {$ref: "#/components/schemas/TesVehicle"}
    TesStats:
      type: object
      required: [strength, agility, wits, empathy]
      properties:
        strength: {type: integer, minimum: 2, maximum: 6}
        agility: {type: integer, minimum: 2, maximum: 6}
        wits: {type: integer, minimum: 2, maximum: 6}
        empathy: {type: integer, minimum: 2, maximum: 6}
    TesDerivatives:
      type: object
      required: [health, hope]
      properties:
        health: {type: integer, minimum: 1}
        hope: {type: integer, minimum: 1}
    TesBliss:
      type: object
      required: [bliss, permanent]
      properties:
        bliss: {type: integer, minimum: 0}
        permanent: {type: integer, minimum: 0}
    TesTalent:
      type: string
      enum:
        - athlete
        - backstabber
        - biker
        - bladeFighter
        - boatman
        - bomber
        - bowman
        - charmer
        - clubFighter
        - conArtist
        - dataMiner
        - dirtyFighter
        - dramaQueen
        - dreamer
        - driver
        - droneOperator
        - electronics
        - evasive
        - gamer
        - hacker
        - hardened
        - intuition
        - leader
        - loneWolf
        - machinegunner
        - martialArtist
        - mechanic
        - medic
        - menacing
        - musician
        - neuroresistant
        - nineLives
        - nurse
        - pilot
        - pistoleer
        - resilient
        - rider
        - scout
        - sleuth
        - sniper
        - speaker
        - stealthy
        - surgeon
        - technoBabbler
        - thief
        - tough
    TesGear:
      type: object
      required: [name, code, type]
      properties:
        name: {type: string}
        code: {type: string}
        type:
          type: string
          enum: [gear, weapon, armor, neurocaster]
        bonus: {type: integer, minimum: 0}
        price: {type: integer, minimum: 0}
        notes: {type: string}
        damage_value: {type: integer, minimum: 0}
        damage_kind: {type: string, enum: [physical, explosive]}
        range_min: {$ref: "#/components/schemas/TesRange"}
        range_max: {$ref: "#/components/schemas/TesRange"}
        tags:
          type: array
          items: {type: string}
        blast_power: {type: integer, minimum: 1}
        armor_level: {type: integer, minimum: 1}
        agility_modifier: {type: integer, minimum: -3, maximum: 0}
        processor: {type: integer, minimum: 1}
        network: {type: integer, minimum: 1}
        graphics: {type: integer, minimum: 1}
    TesRange:
      type: string
      enum: [engaged, short, medium, long, extreme]
    TesJourney:
      type: object
      required: [goal, threat]
      properties:
        goal: {type: string}
        threat: {type: string}
    TesTension:
      type: object
      required: [traveller_name, tension]
      properties:
        traveller_name: {type: string}
        tension: {type: integer, minimum: 1, maximum: 2}
    TesConditions:
      type: object
      properties:
        injuries:
          type: array
          items: {type: string}
        traumas:
          type: array
          items: {type: string}
    TesVehicle:
      type: object
      required: [vehicle_type, model, passenger, fuel, stats, SharedGear]
      properties:
        vehicle_type:
          type: string
          enum: [horse, wagon, bicycle, motorcycle, dirtBike, 2wdCar, 4wdCar, pickupTruck, van, lightTruck, heavyTruck, bus, rowboat, smallSailingBoat, smallMotorBoat, helicopter, lightAirplane, smallCommercialDroneShip, militaryDroneShip]
        model: {type: string}
        passenger: {type: integer, minimum: 0}
        fuel: {type: string}
        description: {type: string}
        stats: {$ref: "#/components/schemas/TesVehicleStats"}
        SharedGear:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: "#/components/schemas/TesGear"}
    TesVehicleStats:
      type: object
      required: [maneuverability, speed, hull, armor]
      properties:
        maneuverability: {type: integer, minimum: 0}
        speed: {type: integer, minimum: 1}
        hull: {type: integer, minimum: 1}
        armor: {type: integer, minimum: 0}
        traits:
          type: array
          items: {$ref: "#/components/schemas/TesVehicleTrait"}
        gear:
          type: array
          items: {$ref: "#/components/schemas/TesGear"}
    TesVehicleTrait:
      type: object
      required: [name, stat, bonus]
      properties:
        name: {type: string}
        stat: {type: string, enum: [maneuverability, speed, hull, armor]}
        bonus: {type: integer, minimum: 1}
